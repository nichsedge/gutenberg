[project]
name = "gutenberg"
version = "0.2.0"
description = "Computational literary & philosophical corpus analysis platform for Project Gutenberg ebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "ebooklib>=0.20",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "nltk>=3.9.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "requests>=2.32.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.15.0",
    "uvicorn>=0.52.3",
    "wordcloud>=1.9.6",
]

[project.scripts]
gutenberg = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

